name: Release

# Erstellt automatisch ein Release, sobald auf main eine neue Version in package.json steht.
# Ein Tag v<Version> wird dabei angelegt. Alternativ startet ein manuell gepushter Tag v* das Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Version bestimmen
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          # Ein von Hand gepushter Tag muss zur Version in package.json passen, sonst trägt das Release eine andere Nummer als der Code
          PKG=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$VERSION" != "$PKG" ]]; then
            echo "Tag v$VERSION passt nicht zu package.json ($PKG)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1 && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION ist bereits veröffentlicht. Kein neues Release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests
        if: steps.v.outputs.exists == 'false'
        run: node test/run-tests.mjs

      - name: Build
        if: steps.v.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          node scripts/build.mjs
          cp dist/index.html "dist/pp-steuerschaetzer-${VERSION}.html"

      - name: Release erstellen
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Steuerschätzer ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: dist/pp-steuerschaetzer-${{ steps.v.outputs.version }}.html
